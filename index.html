<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="first-part">
        <h2 class="head1">Rock Paper Scissors</h2>
        <h4 class="head2">Leading game in the industry</h4>
    </div>

    <h3 class="score">score</h3>
    <div id="score-board">
        <div class="human">
            <div class="scores">0</div>
            <h4>human</h4>
            <div class="human-output"></div>
        </div>
        <br>
        <hr>
        <br>
        <div class="Artifical-intelligence">
            <div class="scores">0</div>
            <h4>AI</h4>
            <div class="ai-output"></div>
        </div>
    </div>
    <div id="winner">
        <h2>Start Game</h2>
    </div>

    <div id="buttons">
        <div class="first-button">
            <button id="rock" class="btn">Rock</button>
            <button id="paper" class="btn">Paper</button>
            <button id="scissors" class="btn">Scissors</button>
        </div>
        <button id="reset" class="btn1">Reset</button>
    </div>

    <h3 class="game-count">Game count:</h3>
    <script src="script2.js"></script>
</body>

</html>
